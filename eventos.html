<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1838">
<title>Eventos e calendário · E.E. Maria Vicência Brandão</title>
<link rel="icon" href="img/favicon.png">
<link rel="stylesheet" href="style.css">
</head>
<body data-pagina="eventos">
<main>
  <section id="eventos" class="bloco reveal">
    <div class="titulo-bloco"><span class="script">anote na agenda</span><h2>Próximos eventos</h2></div>
    <ul class="eventos" id="listaEventos"></ul>
  </section>
  <section id="calendario" class="bloco reveal">
    <div class="titulo-bloco"><span class="script">mês a mês</span><h2>Calendário</h2></div>
    <div class="cal-nav">
      <button id="mesAnt" aria-label="Mês anterior">&#9664;</button>
      <strong id="mesTitulo"></strong>
      <button id="mesProx" aria-label="Próximo mês">&#9654;</button>
    </div>
    <div class="cal" id="cal"></div>
  </section>
</main>
<script src="alunos.js"></script>
<script src="script.js"></script>
</body>
</html>
